<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#95D5B2">
  <title>Nueva contraseña · Convivir</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='14' fill='%23E3F1E4'/%3E%3Cpath d='M9 24 24 11 39 24' fill='none' stroke='%232F6B4F' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='18' cy='29' r='4' fill='%2395D5B2'/%3E%3Ccircle cx='30' cy='29' r='4' fill='%2374C69D'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/convivir.css">
</head>
<body class="lp">

<header class="lp-nav">
  <div class="lp-nav-in">
    <a href="/login" class="logo" aria-label="Convivir"><span class="logo">
  <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Convivir">
    <rect width="48" height="48" rx="14" fill="#E3F1E4"/>
    <path d="M9 24 24 11 39 24" stroke="#2F6B4F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 23.4c-2.2-1.6-3.4-2.7-3.4-4a1.9 1.9 0 0 1 3.4-1.1 1.9 1.9 0 0 1 3.4 1.1c0 1.3-1.2 2.4-3.4 4z" fill="#F4B6A0"/>
    <circle cx="18" cy="29" r="3.8" fill="#95D5B2"/>
    <circle cx="30" cy="29" r="3.8" fill="#74C69D"/>
    <path d="M11.5 40c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" stroke="#95D5B2" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M23.5 40c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" stroke="#74C69D" stroke-width="2.4" stroke-linecap="round"/>
  </svg>
  <span class="logo-texto">CONVIVIR</span>
</span></a>
    <nav class="lp-links">
      <a class="btn btn-link" href="/login">Iniciar sesión</a>
    </nav>
  </div>
</header>

<main>
  <section class="lp-seccion">
    <div class="lp-acceso">
      <div class="lp-login">
        <h2>Crea tu nueva contraseña</h2>

        <div id="bloqueInvalido" hidden>
          <div class="lp-msg err">El enlace no es válido, ya se usó o venció.</div>
          <a class="olvido" href="/recuperar">Solicitar un enlace nuevo</a>
        </div>

        <form id="formRestablecer" method="post" hidden>
          <div class="lp-msg err" id="msgError" hidden></div>
          
          <label for="password">Nueva contraseña (mínimo 8 caracteres)</label>
          <input id="password" name="password" type="password" minlength="8" required autofocus autocomplete="new-password">
          <label for="confirmar">Repite la contraseña</label>
          <input id="confirmar" name="confirmar" type="password" minlength="8" required autocomplete="new-password">
          <button type="submit">Guardar contraseña</button>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="lp-pie">Convivir · Proyecto de Ingeniería de Software II · Universidad Simón Bolívar</footer>
<script>
// RF-002: valida el enlace y guarda la nueva contraseña por la API.
(function () {
  var token = new URLSearchParams(location.search).get('token') || '';
  var form = document.getElementById('formRestablecer');
  var invalido = function () { form.hidden = true; document.getElementById('bloqueInvalido').hidden = false; };
  fetch('/api/recuperacion/token?token=' + encodeURIComponent(token))
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d.valido) form.hidden = false; else invalido(); })
    .catch(invalido);
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var error = document.getElementById('msgError');
    error.hidden = true;
    var boton = form.querySelector('button[type=submit]');
    boton.disabled = true;
    fetch('/api/recuperacion/restablecer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, password: form.password.value, confirmar: form.confirmar.value })
    }).then(function (r) {
      if (r.ok) { location.replace('/login?restablecido'); return; }
      return r.json().then(function (d) {
        if (d.invalido) { invalido(); return; }
        error.textContent = d.error || 'No se pudo guardar la contraseña.';
        error.hidden = false;
        boton.disabled = false;
      });
    }).catch(function () {
      error.textContent = 'No se pudo guardar la contraseña. Revisa tu conexión e intenta de nuevo.';
      error.hidden = false;
      boton.disabled = false;
    });
  });
})();
</script>
</body>
</html>
